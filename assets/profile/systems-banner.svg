    <linearGradient id="accent"><stop stop-color="#67E8F9"/><stop offset="1" stop-color="#A7F3D0"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#82B7D5" stroke-opacity=".045"/></pattern>
  </defs>
  <rect width="1280" height="340" rx="20" fill="url(#bg)"/>
  <rect x="1" y="1" width="1278" height="338" rx="19" fill="none" stroke="#244257"/>
  <rect x="800" y="1" width="479" height="338" rx="19" fill="url(#grid)"/>
  <path d="M48 48h28M48 48v28M1232 292h-28M1232 292v-28" fill="none" stroke="#67E8F9" stroke-width="2"/>
