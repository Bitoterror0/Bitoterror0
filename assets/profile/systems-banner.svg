<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="title desc">
  <title id="title">Victor Silva Lopes — Sistemas, dados e continuidade</title>
  <desc id="desc">Identidade visual em azul escuro, ciano e verde, com conexões geométricas entre dados, sistemas e APIs. Analista de Sistemas II, Oracle SQL/PLSQL, Soul MV e sustentação N2/N3.</desc>
  <defs>
